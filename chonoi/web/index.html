<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 18px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  /* Lớp màn hình (MENU, giới thiệu, kết quả…) chỉ có ở trình duyệt; mọi chữ ≥ 18px. */
  #screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8, 12, 16, .72); }
  #screen.show { display: flex; }
  .card { background: #1b252e; border: 1px solid #3a4a57; border-radius: 12px; padding: 28px 36px; min-width: 320px;
          max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center; font-size: 18px; }
  .card h1 { font-size: 36px; margin: 0 0 8px; color: #ffe082; }
  .card h2 { font-size: 28px; margin: 0 0 8px; color: #ffe082; }
  .card p { margin: 8px 0; color: #cfd8dc; }
  .card .hint { color: #9fb3c0; margin-top: 16px; }
  .stats { margin: 14px auto 4px; border-collapse: collapse; font-size: 20px; }
  .stats td { padding: 4px 14px; text-align: left; }
  .stats td + td { text-align: right; font-weight: 600; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  .btns button { font: 600 20px system-ui, sans-serif; padding: 10px 28px; border: 0; border-radius: 8px; cursor: pointer; background: #ff8a3d; color: #1a1209; }
  .btns button.secondary { background: #3a4a57; color: #e8eef2; }
  .btns button:focus-visible { outline: 3px solid #ffe082; outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="screen" role="dialog" aria-live="polite"></div>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại · L = bật/tắt nhật ký event.
 * Các màn MENU / giới thiệu / kết quả chỉ ở lớp trình bày (trình duyệt); headless chỉ có pha gameplay.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const screenEl = document.getElementById("screen");
let snap = null, offline = false, stopped = false, showLog = false;
const num = (v) => typeof v === "number" && isFinite(v);

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (screen !== "PLAY") {
    // Màn giới thiệu: phím bất kỳ để bỏ qua. MENU / kết quả: dùng nút (chuột, Tab, Enter, Space).
    if ((screen === "DAY_INTRO" || screen === "EVENING_INTRO") && !e.repeat) { e.preventDefault(); setScreen("PLAY"); }
    return;
  }
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { startRun(); return; }
  else if (k === "l") showLog = !showLog;
  pushInput();
});
addEventListener("keyup", (e) => {
  if (screen !== "PLAY") return;  // phím đã được nhả hết khi rời màn chơi
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
// epoch / pendingRestarts: bỏ snapshot cũ còn bay về sau khi vừa gọi /restart (tránh hiện nhầm kết quả ván trước).
let epoch = 0, pendingRestarts = 0;
async function poll() {
  if (stopped) return;
  const ep = epoch, clean = pendingRestarts === 0;
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const s = await r.json();
    offline = false;
    if (clean && ep === epoch && s && typeof s === "object") {
      snap = s;
      try { onSnapshot(s); } catch (e) { console.error(e); }
    }
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}

// ---------- màn hình: MENU → (DAY_INTRO) → chơi → (EVENING_INTRO) → DAY_RESULT → (SUMMARY) ----------
// Mode gather/quan độc lập: MENU → chơi; quán kết thúc (event quan_end) → DAY_RESULT.
// Mode day (chờ Nghĩa chốt hợp đồng): đổi pha theo snap.phase; Shop và pause CHƯA làm ở đợt này.
let screen = "MENU";
let introTimer = null;
const INTRO_MS = 4000;
const track = { lastTick: -1, lastEventTick: -1, prevPhase: null, served: 0, left: 0, leftClosing: 0, result: null };

function resetTrack() {
  Object.assign(track, { lastTick: -1, lastEventTick: -1, prevPhase: null, served: 0, left: 0, leftClosing: 0, result: null });
}
function isDay() { return !!snap && snap.mode === "day"; }

async function restartGame() {
  epoch++; pendingRestarts++;
  resetTrack(); down.clear(); lastSent = "";
  try { await fetch("/restart", { method: "POST" }); } catch (e) { /* poll sẽ báo mất kết nối */ }
  pendingRestarts--;
  pushInput();
}
// Server chạy mô phỏng ngay khi khởi động, nên "Chơi" / "Chơi lại" gọi /restart để ván bắt đầu từ đầu.
function startRun() {
  restartGame();
  setScreen(isDay() ? "DAY_INTRO" : "PLAY");
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function card(body, buttons, hint) {
  const btns = buttons.map(([act, label, secondary]) =>
    `<button type="button" data-act="${act}"${secondary ? ' class="secondary"' : ""}>${esc(label)}</button>`).join("");
  return `<div class="card">${body}${btns ? `<div class="btns">${btns}</div>` : ""}${hint ? `<p class="hint">${esc(hint)}</p>` : ""}</div>`;
}
function statsTable(rows) {
  if (!rows.length) return "<p>(Chưa có số liệu)</p>";
  return `<table class="stats">${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>`;
}
// Số khách: ưu tiên số do sim ghi trong quan_end (nếu sau này có), không thì đếm event served / customer_left từ lúc bấm Chơi.
function pickNum(d, keys) { for (const k of keys) if (num(d[k])) return d[k]; return null; }
function resultRows(d) {
  d = d && typeof d === "object" ? d : {};
  const rows = [];
  const money = num(d.money) ? d.money : (snap && num(snap.money) ? snap.money : null);
  if (money !== null) rows.push(["Tiền", money + "k"]);
  if (num(d.shift_earned)) rows.push(["Kiếm được ca này", d.shift_earned + "k"]);
  const rep = num(d.reputation) ? d.reputation : (snap && num(snap.reputation) ? snap.reputation : null);
  if (rep !== null) rows.push(["Uy tín", rep.toFixed(1)]);
  if (snap && num(snap.score)) rows.push(["Điểm", snap.score]);
  const served = pickNum(d, ["served_count", "customers_served"]);
  const left = pickNum(d, ["left_count", "customers_left"]);
  rows.push(["Khách đã phục vụ", served !== null ? served : track.served]);
  rows.push(["Khách bỏ đi", left !== null ? left : track.left]);
  if (left === null && track.leftClosing) rows.push(["Khách về khi đóng quán", track.leftClosing]);
  return rows;
}
function summaryRows() {
  const rows = [];
  if (!snap) return rows;
  if (num(snap.days_completed)) rows.push(["Số ngày hoàn tất", snap.days_completed]);
  if (num(snap.money)) rows.push(["Tiền", snap.money + "k"]);
  if (num(snap.earned)) rows.push(["Tổng kiếm được", snap.earned + "k"]);
  if (num(snap.reputation)) rows.push(["Uy tín", snap.reputation.toFixed(1)]);
  if (num(snap.score)) rows.push(["Điểm", snap.score]);
  return rows;
}
const INTRO_HINT = "Tự vào sau 4 giây · nhấn phím bất kỳ để bỏ qua";
const SCREENS = {
  MENU: () => card("<h1>Quán Ăn Chợ Nổi</h1><p>Sáng lặn bắt cá, hái rau · tối mở quán đãi khách.</p>",
                   [["play", "Chơi"], ["exit", "Thoát", true]], "Chuột hoặc Tab + Enter để chọn"),
  // TODO(phase 2): hiện "Ngày N" khi Nghĩa chốt trường số Ngày trong snapshot day.
  DAY_INTRO: () => card("<h2>Buổi sáng</h2><p>Lặn bắt cá, hái rau trên sông. Nhớ lên mặt nước thở!</p>", [["skip", "Bắt đầu"]], INTRO_HINT),
  EVENING_INTRO: () => card("<h2>Buổi tối</h2><p>Mở quán: nấu món, bưng ra đúng bàn trước khi khách hết kiên nhẫn.</p>", [["skip", "Mở quán"]], INTRO_HINT),
  DAY_RESULT: (d) => card("<h2>Kết quả buổi tối</h2>" + statsTable(resultRows(d)),
                          isDay() ? [["continue", "Tiếp tục"]] : [["restart", "Chơi lại"], ["menu", "Về menu", true]]),
  SUMMARY: () => card("<h2>Tổng kết</h2>" + statsTable(summaryRows()), [["restart", "Chơi lại"], ["menu", "Về menu", true]]),
  EXIT: () => card("<h2>Đã thoát</h2><p>Đã thoát, đóng tab để kết thúc.</p>", []),
};
const ACTIONS = {
  play: startRun,
  restart: startRun,
  exit: () => { stopped = true; setScreen("EXIT"); },
  skip: () => setScreen("PLAY"),
  continue: () => setScreen("PLAY"),   // mode day: sau này sang Shop
  menu: () => setScreen("MENU"),
};
function setScreen(name, data) {
  clearTimeout(introTimer); introTimer = null;
  screen = name;
  if (name !== "PLAY") { down.clear(); pushInput(); }   // nhả mọi phím: nhân vật đứng yên khi đang ở màn UI
  const html = SCREENS[name] ? SCREENS[name](data) : "";
  screenEl.innerHTML = html;
  screenEl.classList.toggle("show", !!html);
  screenEl.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => ACTIONS[b.dataset.act]()));
  const first = screenEl.querySelector("button");
  if (first) first.focus();
  if (name === "DAY_INTRO" || name === "EVENING_INTRO") introTimer = setTimeout(() => { if (screen === name) setScreen("PLAY"); }, INTRO_MS);
}
// Đọc snapshot + event mới để đếm khách và chuyển màn.
function onSnapshot(s) {
  if (num(s.tick) && s.tick < track.lastTick) resetTrack();   // server đã chơi lại (vd. R ở tab khác)
  if (num(s.tick)) track.lastTick = s.tick;
  if (screen === "MENU" || screen === "EXIT") return;
  const events = Array.isArray(s.events) ? s.events : [];
  let quanEnd = null, maxTick = track.lastEventTick;
  events.forEach((e) => {
    if (!e || !num(e.tick) || e.tick <= track.lastEventTick) return;   // event đã xử lý ở lần poll trước
    maxTick = Math.max(maxTick, e.tick);
    const d = e.data && typeof e.data === "object" ? e.data : {};
    if (e.name === "served") track.served++;
    else if (e.name === "customer_left") { if (d.reason === "closing") track.leftClosing++; else track.left++; }
    else if (e.name === "quan_end") quanEnd = d;
  });
  track.lastEventTick = maxTick;
  // mode day: đổi pha thì hiện màn giới thiệu tương ứng (pha "shop" chờ hợp đồng Shop).
  let next = null;
  if (s.mode === "day" && track.prevPhase && s.phase !== track.prevPhase) {
    if (s.phase === "gather") next = "DAY_INTRO";
    else if (s.phase === "quan") next = "EVENING_INTRO";
  }
  track.prevPhase = s.phase;
  if (quanEnd) { track.result = quanEnd; setScreen("DAY_RESULT", quanEnd); return; }
  if (screen !== "PLAY") return;
  if (s.mode === "day" && s.finished && s.reason === "days_complete") { setScreen("SUMMARY"); return; }
  if (next) setScreen(next);
}

// ---------- vẽ ----------
const HUD = 18, LH = 24;   // cỡ chữ HUD tối thiểu (AC-P2-03) và khoảng cách dòng
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function setFont(size, bold) { ctx.font = (bold ? "bold " : "") + size + "px system-ui, sans-serif"; }
// Vẽ chữ (mặc định 18px), trả về bề ngang đã vẽ để xếp các mục cạnh nhau không đè.
function text(s, x, y, o = {}) {
  setFont(o.size || HUD, o.bold);
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  s = String(s);
  if (o.maxW) s = clip(s, o.maxW);
  ctx.fillText(s, x, y);
  return ctx.measureText(s).width;
}
// Cắt chữ (thêm "…") cho vừa bề ngang maxW px, đo bằng font đang đặt — để chữ không tràn/đè lên nhau.
function clip(s, maxW) {
  if (ctx.measureText(s).width <= maxW) return s;
  while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
  return s + "…";
}
// Xếp các mảnh chữ thành nhiều dòng vừa maxW px (không cắt mất mảnh nào). Mảnh dài hơn cả dòng thì tách theo từ.
function wrapParts(parts, sep, maxW, size) {
  setFont(size);
  const lines = [];
  let cur = "";
  parts.forEach((part) => {
    const next = cur ? cur + sep + part : part;
    if (!cur || ctx.measureText(next).width <= maxW) { cur = next; return; }
    lines.push(cur);
    cur = part;
  });
  if (cur) lines.push(cur);
  if (sep === " ") return lines;
  return lines.flatMap((ln) => (ctx.measureText(ln).width <= maxW ? [ln] : wrapParts(ln.split(" "), " ", maxW, size)));
}
const wrapWords = (s, maxW) => wrapParts(String(s).split(" "), " ", maxW, HUD);
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h / 2 + 1, { align: "center", base: "middle", bold: true, color: "#fff" });
}
function fmtTime(ticks) {
  if (typeof ticks !== "number" || !isFinite(ticks)) return "–:––";  // snapshot chưa có trường thời gian
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
// Nhật ký event (L để bật/tắt), nằm trên bộ đếm FPS ở góc dưới phải.
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  if (!ev.length) return;
  const maxW = Math.min(w * 0.6, 640), y0 = h - 40 - ev.length * LH;
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(w - maxW - 24, y0 - 4, maxW + 14, ev.length * LH + 8);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 14, y0 + (i + 1) * LH - 6, { align: "right", color: "#cfd8dc", maxW }));
}
// Chú thích phím ở góc dưới trái (chừa chỗ cho FPS bên phải).
function helpLine(w, h, s) { text(s, 14, h - 12, { color: "#9fb3c0", maxW: w - 140 }); }
function banner(msg, w, y) {
  setFont(HUD, true);
  const bw = Math.min(w - 32, ctx.measureText(msg).width + 32);
  ctx.fillStyle = "rgba(60,10,10,.85)"; ctx.fillRect(w / 2 - bw / 2, y - 22, bw, 34);
  text(msg, w / 2, y, { align: "center", color: "#ffb4ab", bold: true, maxW: bw - 16 });
}
function overlay(w, h) {
  if (offline) banner("Mất kết nối tới máy chủ (đã tắt chưa?)", w, h / 2 - 90);
  if (snap.error) banner("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w, h / 2 - 50);
  // Quán kết thúc có màn DAY_RESULT riêng; khung này còn dùng cho buổi sáng độc lập.
  if (snap.finished && screen === "PLAY" && snap.mode !== "quan") {
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(w / 2 - 230, h / 2 - 50, 460, 100);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "chơi") + " kết thúc" + (snap.reason ? ": " + snap.reason : ""), w / 2, h / 2 - 8, { align: "center", size: 24, maxW: 440 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 26, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 78, bottom = 104;   // trên: 2 hàng HUD · dưới: ô giỏ, dòng giỏ, dòng phím
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 3, { color: "rgba(255,255,255,.45)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { align: "center", color: "#5a3a22", bold: true });
  // nút hái (bỏ nhãn id cho gọn; còn số giây mọc lại)
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 0.6 * s + 16, { align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
  });
  // người chơi
  const p = snap.player;
  const hasPos = p && Array.isArray(p.pos) && num(p.pos[0]) && num(p.pos[1]);
  if (hasPos) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }
  // HUD hàng 1: giờ · oxy · Máu · độ sâu (mỗi mục đặt sau mục trước, đo bề ngang để không đè)
  const GAP = 20;
  let x = 14 + text("⏱ " + fmtTime(snap.time_left_ticks), 14, 34, { size: 24 }) + GAP;
  const hasOxy = p && num(p.oxygen_ticks) && num(p.oxygen_max_ticks) && p.oxygen_max_ticks > 0;
  const lowOxy = hasOxy && p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
  if (hasOxy) {
    bar(x, 12, 220, 28, p.oxygen_ticks / p.oxygen_max_ticks, lowOxy ? "#ef5350" : "#2b9fd8", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
    x += 220 + GAP;
  }
  if (p && num(p.hp) && num(p.hp_max) && p.hp_max > 0) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    x += text(hs, x, 35, { size: 26, color: "#ff6b81" }) + 8;
    x += text(`Máu ${p.hp}/${p.hp_max}`, x, 33, { color: "#ffb3bf" }) + GAP;
  }
  if (hasPos) text("Sâu " + Math.max(0, p.pos[1]).toFixed(1) + " m", x, 33, { color: "#cfe8f5" });
  // HUD hàng 2: cảnh báo oxy · hồi bắt cá
  let x2 = 14;
  if (lowOxy) x2 += text("Sắp hết oxy — lên thở!", x2, 66, { size: 20, bold: true, color: "#ff6b6b" }) + GAP;
  if (p && num(p.catch_cd_ticks) && p.catch_cd_ticks > 0) text("Hồi bắt cá " + (p.catch_cd_ticks / 60).toFixed(1) + "s", x2, 66, { color: "#9fb3c0" });
  // giỏ (khoang) dưới — số trong giỏ: ưu tiên hold_count của snapshot, không có thì đếm mảng hold.
  const hold = Array.isArray(snap.hold) ? snap.hold : [];
  const holdCount = num(snap.hold_count) ? snap.hold_count : (Array.isArray(snap.hold) ? snap.hold.length : null);
  if (holdCount !== null && num(snap.hold_capacity) && snap.hold_capacity > 0) {
    const cap = snap.hold_capacity, full = holdCount >= cap;
    const sz = Math.max(10, Math.min(30, (w - 28) / cap - 4)), y0 = h - 96;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      if (i < holdCount) { ctx.fillStyle = hold[i] ? kc(hold[i]) : "#bbbbbb"; ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6); }
      if (full) { ctx.strokeStyle = "#ef5350"; ctx.lineWidth = 2; ctx.strokeRect(x0 + 1, y0 + 1, sz - 2, sz - 2); }
    }
    const names = {}; hold.forEach((k) => (names[k] = (names[k] || 0) + 1));
    const kinds = Object.keys(names).map((k) => (KIND_NAME[k] || k) + "×" + names[k]).join(", ");
    text("Giỏ " + holdCount + "/" + cap + (full ? " · Giỏ đầy" : "") + (kinds ? " · " + kinds : ""), 14, h - 42,
         { color: full ? "#ff6b6b" : "#cfd8dc", bold: full, maxW: w - 28 });
  }
  helpLine(w, h, "WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · R chơi lại · L nhật ký");
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh bông điên điển" };
// Snapshot bỏ các loại có tồn 0, nên HUD tự liệt kê 4 mã nguyên liệu hợp lệ của kho (chỉ để hiển thị).
const QUAN_KINDS = ["ca_loc", "ca_linh", "bong_dien_dien", "bong_sung"];
// Theo c.state của snapshot thật: "waiting" | "eating" (order_status là trường riêng). Trạng thái lạ thì hiện nguyên giá trị.
const CUSTOMER_STATE = { waiting: "đang chờ", eating: "đang ăn" };

// Tên món tiếng Việt; nhận chuỗi dish_id hoặc payload {order_id, dish_id, base_price}.
function dishName(d) {
  if (d === null || d === undefined || d === "") return "";
  const id = typeof d === "object" ? d.dish_id : d;
  if (id === null || id === undefined || id === "") return "món";
  return DISH_NAME[id] || String(id);
}
// Kho khả dụng = stock[loại] − tổng customer.reserved[loại] của các đơn order_status "reserved".
function quanStockLine() {
  if (!snap.stock || typeof snap.stock !== "object") return null;
  const stock = snap.stock, held = {};
  (Array.isArray(snap.customers) ? snap.customers : []).forEach((c) => {
    if (!c || c.order_status !== "reserved" || !c.reserved || typeof c.reserved !== "object") return;
    Object.keys(c.reserved).forEach((k) => (held[k] = (held[k] || 0) + (Number(c.reserved[k]) || 0)));
  });
  const kinds = QUAN_KINDS.slice();
  Object.keys(stock).concat(Object.keys(held)).forEach((k) => { if (!kinds.includes(k)) kinds.push(k); });
  // Trả về từng mảnh "loại ×số" để HUD tự xuống dòng giữa các loại khi cửa sổ hẹp.
  const parts = kinds.map((k) => {
    const real = Number(stock[k]) || 0, avail = real - (held[k] || 0);
    return (KIND_NAME[k] || k) + " ×" + avail + (avail !== real ? ` (tồn ${real})` : "");
  });
  parts[0] = "Kho khả dụng: " + parts[0];
  return parts;
}
function stoveLine(st) {
  const name = dishName(st.dish) || "món";
  let s = "trống";
  if (st.state === "cooking") s = "đang nấu " + name + (num(st.cook_ticks_left) ? ` còn ${Math.ceil(st.cook_ticks_left / 60)}s` : "");
  else if (st.state === "ready") s = "đã chín " + name;
  return `Bếp ${st.id ?? "?"}: ${s}`;
}
// Khung bên phải: bếp, món trên tay, rồi bảng "Khách" (bàn · món · trạng thái · giây kiên nhẫn còn lại).
// Chữ dài thì xuống dòng (không cắt); thiếu chiều cao thì gom thành "+N khách nữa".
function drawSidePanel(x0, y0, pw, yMax) {
  const pad = 12, inner = pw - 2 * pad, gap = 6;
  const top = [];   // các dòng bếp / tay
  if (Array.isArray(snap.stoves)) snap.stoves.forEach((st) => { if (st && typeof st === "object") top.push(...wrapWords(stoveLine(st), inner)); });
  if ("hand" in snap) top.push(...wrapWords("Đang cầm: " + (snap.hand ? dishName(snap.hand) || "món" : "tay trống"), inner));
  const hasCust = Array.isArray(snap.customers);
  const list = hasCust ? snap.customers.filter((c) => c && typeof c === "object") : [];
  setFont(HUD);
  const tblW = Math.ceil(Math.max(24, ...list.map((c) => ctx.measureText(String(c.table_id ?? "?")).width))) + 12;
  const rows = list.map((c) => {
    const st = CUSTOMER_STATE[c.state] || (c.state ? String(c.state) : "?");
    const pat = num(c.patience_ticks_left) ? Math.ceil(c.patience_ticks_left / 60) + "s" : "–";
    const right = st + " " + pat;
    setFont(HUD);
    const dishW = Math.max(80, inner - tblW - ctx.measureText(right).width - 14);
    const dish = wrapWords(dishName(c.dish_id) || "?", dishW);
    const col = c.state === "waiting" ? "#f4b6c2" : c.state === "eating" ? "#a5d6a7" : "#e8eef2";
    return { c, right, dish, dishW, col, hgt: dish.length * LH + gap };
  });
  // dàn chiều cao
  let used = pad + top.length * LH + (top.length && hasCust ? 10 : 0) + (hasCust ? LH + 4 : 0);
  const shown = [];
  for (const r of rows) {
    const reserve = shown.length + 1 < rows.length ? LH : 0;   // chừa dòng "+N khách nữa"
    if (y0 + used + r.hgt + reserve > yMax && shown.length) break;
    shown.push(r); used += r.hgt;
  }
  const more = rows.length - shown.length;
  if (hasCust && !list.length) used += LH;
  if (more) used += LH;
  ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(x0, y0, pw, used + pad - 4);
  // vẽ
  let y = y0 + pad + 16;
  top.forEach((ln) => { text(ln, x0 + pad, y, { color: "#cfd8dc", maxW: inner }); y += LH; });
  if (!hasCust) return;
  if (top.length) y += 10;
  text("Khách", x0 + pad, y, { bold: true, color: "#ffe082" });
  y += LH + 4;
  if (!list.length) { text("(chưa có khách)", x0 + pad, y, { color: "#9fb3c0" }); return; }
  shown.forEach((r) => {
    text(String(r.c.table_id ?? "?"), x0 + pad, y, { bold: true, maxW: tblW - 4 });
    r.dish.forEach((ln, i) => text(ln, x0 + pad + tblW, y + i * LH, { maxW: r.dishW }));
    text(r.right, x0 + pw - pad, y, { align: "right", color: r.col });
    y += r.hgt;
  });
  if (more) text(`+${more} khách nữa`, x0 + pad, y, { color: "#9fb3c0" });
}

function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  // HUD hàng 1: giờ · tiền · uy tín · điểm (trường nào chưa có thì không hiện)
  const GAP = 24;
  const x = 14 + text("⏱ " + fmtTime(snap.time_left_ticks), 14, 34, { size: 24 }) + GAP;
  const stats = [];
  if (num(snap.money)) stats.push(`Tiền ${snap.money}k`);
  if (num(snap.reputation)) stats.push(`uy tín ${snap.reputation.toFixed(1)}`);
  if (num(snap.score)) stats.push(`điểm ${snap.score}`);
  if (stats.length) text(stats.join(" · "), x, 33, { bold: true, maxW: w - x - 14 });
  // Kho khả dụng: tự xuống dòng giữa các loại, không cắt mất loại nào.
  const stockParts = quanStockLine();
  const kho = stockParts ? wrapParts(stockParts, " · ", w - 28, HUD) : [];
  kho.forEach((ln, i) => text(ln, 14, 62 + i * LH, { color: "#cfd8dc", maxW: w - 28 }));
  const top = kho.length ? 62 + (kho.length - 1) * LH + 18 : 50, bottom = 44;
  // khung bên phải (bếp, tay, khách) + bản đồ quán bên trái
  const hasPanel = Array.isArray(snap.customers) || Array.isArray(snap.stoves) || "hand" in snap;
  const panelW = hasPanel ? Math.round(Math.min(w * 0.45, Math.max(300, Math.min(420, w * 0.32)))) : 0;
  const X = b.x[1], Z = b.z[1];
  const mapW = w - 40 - (hasPanel ? panelW + 10 : 0);
  const s = Math.max(1, Math.min(mapW / X, (h - top - bottom) / Z));
  const ox = 20 + (mapW - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp (tên món xem ở khung bên phải; trên bản đồ chỉ còn mã bếp + giây nấu)
  (snap.stoves || []).forEach((st) => {
    if (!st || !Array.isArray(st.pos)) return;
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id ?? "?", sx(st.pos[0]), sy(st.pos[1]) + 6, { align: "center", color: "#111", bold: true });
    if (st.state === "cooking" && num(st.cook_ticks_left)) text(Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 0.8 * s + 20, { align: "center", color: "#2a1a0a", bold: true });
    else if (st.state === "ready") text("chín", sx(st.pos[0]), sy(st.pos[1]) + 0.8 * s + 20, { align: "center", color: "#1f4d16", bold: true });
  });
  // bàn + khách (món của từng bàn xem ở bảng Khách)
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => { if (c) byTable[c.table_id] = c; });
  (snap.tables || []).forEach((tb) => {
    if (!tb || !Array.isArray(tb.pos)) return;
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id ?? "?", sx(tb.pos[0]), sy(tb.pos[1]) + 6, { align: "center", color: "#fff", bold: true });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      if (num(c.patience_ticks_left)) bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 5, c.patience_ticks_left / patMax, "#e57373");
    }
  });
  // người chơi
  const p = snap.player;
  if (p && Array.isArray(p.pos)) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    if (snap.hand) text("🍲", px, py - 0.6 * s - 4, { align: "center", size: 22 });
  }
  if (hasPanel) drawSidePanel(w - panelW - 10, top, panelW, h - bottom);
  helpLine(w, h, "WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại · L nhật ký");
}

// ---------- FPS: trung bình theo từng 1 giây (đo AC-P2-03) ----------
const fps = { frames: 0, t0: performance.now(), value: null };
function drawFps(w, h) {
  fps.frames++;
  const now = performance.now();
  if (now - fps.t0 >= 1000) { fps.value = (fps.frames * 1000) / (now - fps.t0); fps.frames = 0; fps.t0 = now; }
  if (fps.value !== null) text("FPS " + Math.round(fps.value), w - 14, h - 12, { align: "right", bold: true, color: fps.value >= 30 ? "#a5d6a7" : "#ff6b6b" });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (screen !== "EXIT") {
    if (snap) {
      if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
      if (showLog) eventLog(w, h);
      overlay(w, h);
    } else {
      text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center" });
    }
  }
  drawFps(w, h);
}
setScreen("MENU");
poll();
requestAnimationFrame(frame);
</script>

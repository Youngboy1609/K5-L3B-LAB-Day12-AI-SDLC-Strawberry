<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.maxW) s = clip(String(s), o.maxW);
  ctx.fillText(s, x, y);
}
// Cắt chữ (thêm "…") cho vừa bề ngang maxW px, đo bằng font đang đặt — để chữ không tràn/đè lên nhau.
function clip(s, maxW) {
  if (ctx.measureText(s).width <= maxW) return s;
  while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
  return s + "…";
}
// Xếp các mảnh chữ thành nhiều dòng vừa maxW px (không cắt mất mảnh nào). Mảnh dài hơn cả dòng thì tách theo từ.
function wrapParts(parts, sep, maxW, size) {
  ctx.font = size + "px system-ui, sans-serif";
  const lines = [];
  let cur = "";
  parts.forEach((part) => {
    const next = cur ? cur + sep + part : part;
    if (!cur || ctx.measureText(next).width <= maxW) { cur = next; return; }
    lines.push(cur);
    cur = part;
  });
  if (cur) lines.push(cur);
  if (sep === " ") return lines;
  return lines.flatMap((ln) => (ctx.measureText(ln).width <= maxW ? [ln] : wrapParts(ln.split(" "), " ", maxW, size)));
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  if (typeof ticks !== "number" || !isFinite(ticks)) return "–:––";  // snapshot chưa có trường thời gian
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 64, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "#234" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.1 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }
  // HUD trên
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(110, 12, 220, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 345, 29, { size: 22, color: "#ff6b81" });
    const hsW = ctx.measureText(hs).width;  // font 22px vừa đặt trong text()
    text(`Máu ${p.hp}/${p.hp_max}`, 345 + hsW + 8, 27, { size: 14, color: "#ffb3bf" });
  }
  if (p && p.pos) text(`x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)}`, 14, 52, { size: 12, color: "#9fb3c0" });
  if (p && p.catch_cd_ticks > 0) text("hồi chiêu bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 150, 52, { size: 12, color: "#9fb3c0" });
  // giỏ (khoang) dưới
  // Số trong giỏ: ưu tiên hold_count của snapshot, không có thì đếm mảng hold.
  const hold = Array.isArray(snap.hold) ? snap.hold : [];
  const holdCount = typeof snap.hold_count === "number" ? snap.hold_count : (Array.isArray(snap.hold) ? snap.hold.length : null);
  if (holdCount !== null && snap.hold_capacity) {
    const cap = snap.hold_capacity, full = holdCount >= cap;
    const sz = Math.max(8, Math.min(30, (w - 260) / cap - 4)), y0 = h - bottom + 8;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      if (i < holdCount) { ctx.fillStyle = hold[i] ? kc(hold[i]) : "#bbbbbb"; ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6); }
      if (full) { ctx.strokeStyle = "#ef5350"; ctx.lineWidth = 2; ctx.strokeRect(x0 + 1, y0 + 1, sz - 2, sz - 2); }
    }
    const names = {}; hold.forEach((k) => (names[k] = (names[k] || 0) + 1));
    const kinds = Object.keys(names).map((k) => (KIND_NAME[k] || k) + "×" + names[k]).join(", ");
    text("Giỏ " + holdCount + "/" + cap + (full ? " · Giỏ đầy" : "") + (kinds ? "  " + kinds : ""), 14, y0 + sz + 16,
         { size: 12, color: full ? "#ef5350" : "#cfd8dc", maxW: w - 28 });
  }
  text("WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh bông điên điển" };
// Snapshot bỏ các loại có tồn 0, nên HUD tự liệt kê 4 mã nguyên liệu hợp lệ của kho (chỉ để hiển thị).
const QUAN_KINDS = ["ca_loc", "ca_linh", "bong_dien_dien", "bong_sung"];
const CUSTOMER_STATE = { reserved: "đang chờ", assigned: "đang nấu", served: "đang ăn", eating: "đang ăn" };

// Tên món tiếng Việt; nhận chuỗi dish_id hoặc payload {order_id, dish_id, base_price}.
function dishName(d) {
  if (d === null || d === undefined || d === "") return "";
  const id = typeof d === "object" ? d.dish_id : d;
  if (id === null || id === undefined || id === "") return "món";
  return DISH_NAME[id] || String(id);
}
// Kho khả dụng = stock[loại] − tổng customer.reserved[loại] của các khách "reserved".
function quanStockLine() {
  if (!snap.stock || typeof snap.stock !== "object") return null;
  const stock = snap.stock, held = {};
  (Array.isArray(snap.customers) ? snap.customers : []).forEach((c) => {
    if (!c || c.state !== "reserved" || !c.reserved || typeof c.reserved !== "object") return;
    Object.keys(c.reserved).forEach((k) => (held[k] = (held[k] || 0) + (Number(c.reserved[k]) || 0)));
  });
  const kinds = QUAN_KINDS.slice();
  Object.keys(stock).concat(Object.keys(held)).forEach((k) => { if (!kinds.includes(k)) kinds.push(k); });
  // Trả về từng mảnh "loại ×số" để HUD tự xuống dòng giữa các loại khi cửa sổ hẹp.
  const parts = kinds.map((k) => {
    const real = Number(stock[k]) || 0, avail = real - (held[k] || 0);
    return (KIND_NAME[k] || k) + " ×" + avail + (avail !== real ? ` (tồn ${real})` : "");
  });
  parts[0] = "Kho khả dụng: " + parts[0];
  return parts;
}
function stoveLine(st) {
  const name = dishName(st.dish) || "món";
  let s = "trống";
  if (st.state === "cooking") s = "đang nấu " + name + (typeof st.cook_ticks_left === "number" ? ` còn ${Math.ceil(st.cook_ticks_left / 60)}s` : "");
  else if (st.state === "ready") s = "đã chín " + name;
  return `Bếp ${st.id ?? "?"}: ${s}`;
}
// Bảng "Khách" ở cạnh phải: bàn · món · trạng thái · giây kiên nhẫn còn lại.
// Mỗi khách một mục; tên món dài thì xuống dòng trong cột món (không cắt chữ).
function drawCustomerPanel(x0, y0, pw, yMax) {
  const list = snap.customers.filter((c) => c && typeof c === "object");
  const lineH = 16, gap = 4, head = 30, dishX = x0 + 42;
  // Bước 1: dàn trang từng khách (cột trạng thái bên phải đo theo chữ thật, cột món lấy phần còn lại).
  const rows = list.map((c) => {
    const st = CUSTOMER_STATE[c.state] || (c.state ? String(c.state) : "?");
    const pat = typeof c.patience_ticks_left === "number" ? Math.ceil(c.patience_ticks_left / 60) + "s" : "–";
    const right = st + "  " + pat;
    ctx.font = "12px system-ui, sans-serif";
    const dishW = Math.max(60, pw - 42 - ctx.measureText(right).width - 20);
    const dish = wrapParts(String(dishName(c.dish_id) || "?").split(" "), " ", dishW, 12);
    const col = c.state === "reserved" ? "#f4b6c2" : c.state === "assigned" ? "#ffb74d" : (c.state === "served" || c.state === "eating") ? "#a5d6a7" : "#e8eef2";
    return { c, right, dish, dishW, col, hgt: dish.length * lineH + gap };
  });
  // Bước 2: lấy số khách vừa chiều cao (chừa một dòng "+N khách nữa" nếu thiếu chỗ).
  const shown = [];
  let used = head;
  for (const r of rows) {
    const need = used + r.hgt + (shown.length + 1 < rows.length ? lineH : 0);
    if (y0 + need > yMax && shown.length) break;
    shown.push(r); used += r.hgt;
  }
  const more = rows.length - shown.length;
  const total = Math.max(head + lineH + gap, used + (more ? lineH : 0)) + 4;
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x0, y0, pw, total);
  text("Khách", x0 + 8, y0 + 19, { size: 14, color: "#ffe082" });
  text("bàn · món · trạng thái · còn", x0 + pw - 8, y0 + 19, { size: 10, align: "right", color: "#9fb3c0", maxW: pw - 70 });
  if (!list.length) text("(chưa có khách)", x0 + 8, y0 + head + 13, { size: 12, color: "#9fb3c0" });
  let y = y0 + head + 13;
  shown.forEach((r) => {
    text(String(r.c.table_id ?? "?"), x0 + 8, y, { size: 12, color: "#e8eef2", maxW: 30 });
    r.dish.forEach((ln, i) => text(ln, dishX, y + i * lineH, { size: 12, color: "#e8eef2", maxW: r.dishW }));
    text(r.right, x0 + pw - 8, y, { size: 12, align: "right", color: r.col });
    y += r.hgt;
  });
  if (more) text(`+${more} khách nữa`, x0 + 8, y, { size: 11, color: "#9fb3c0" });
}

function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  // Các dòng HUD dưới dòng thời gian: kho khả dụng, từng bếp, món trên tay (trường nào chưa có thì bỏ qua).
  // Dòng nào không đủ chỗ thì tự xuống dòng (kho xuống dòng giữa các loại, không cắt mất loại nào).
  const LINE_H = 19, HUD_Y0 = 52, HUD_SIZE = 13, hudW = w - 28;
  const hud = [];
  const stockParts = quanStockLine();
  if (stockParts) hud.push(...wrapParts(stockParts, " · ", hudW, HUD_SIZE));
  const addLine = (s) => hud.push(...wrapParts(s.split(" "), " ", hudW, HUD_SIZE));
  if (Array.isArray(snap.stoves)) snap.stoves.forEach((st) => { if (st && typeof st === "object") addLine(stoveLine(st)); });
  if ("hand" in snap) addLine("Đang cầm: " + (snap.hand ? dishName(snap.hand) || "món" : "tay trống"));
  const hasPanel = Array.isArray(snap.customers);
  const panelW = hasPanel ? Math.round(Math.min(w * 0.45, Math.max(220, Math.min(340, w * 0.3)))) : 0;
  const X = b.x[1], Z = b.z[1], top = Math.max(64, HUD_Y0 + hud.length * LINE_H), bottom = 40;
  const mapW = w - 40 - (hasPanel ? panelW + 10 : 0);
  const s = Math.max(1, Math.min(mapW / X, (h - top - bottom) / Z));
  const ox = 20 + (mapW - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 4, { size: 12, align: "center", color: "#111" });
    if (st.dish) text(dishName(st.dish), sx(st.pos[0]), sy(st.pos[1]) - 0.95 * s, { size: 10, align: "center", color: "#2a1a0a", maxW: Math.max(60, 4 * s) });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) text(Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.25 * s, { size: 11, align: "center", color: "#2a1a0a" });
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      text(dishName(c.dish_id) || "?", cx, cy - 0.75 * s, { size: 10, align: "center", color: "#2a1a0a", maxW: Math.max(60, 4 * s) });
      if (c.patience_ticks_left !== undefined) bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 5, c.patience_ticks_left / patMax, "#e57373");
    }
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    if (snap.hand) {
      text("🍲 " + (dishName(snap.hand) || "món"), px, py - 0.8 * s, { size: 11, align: "center", color: "#2a1a0a", maxW: Math.max(80, 5 * s) });
    }
  }
  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  text(`Tiền ${snap.money ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 110, 28, { size: 16 });
  hud.forEach((line, i) => text(line, 14, HUD_Y0 + i * LINE_H, { size: HUD_SIZE, color: "#cfd8dc", maxW: hudW }));
  if (hasPanel) drawCustomerPanel(w - panelW - 10, top, panelW, h - 170);  // h-170: chừa chỗ cho nhật ký event góc dưới phải
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
